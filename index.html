<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Battleship</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link href="css/style.css" rel="stylesheet" />

</head>

<body>
    <h1>Battleship</h1>




    <div class="container">
        <div class="row">
            <div class="col-md-6">

                <h3>Place your boats</h3>
                <div class="form-group">
                    <ul id="userBoats" class="list-group-numbered"></ul>
                    <div>
                        <h3 id="boatSelectedTitle"></h3>
                        <label id="errorMessage" class="text-danger"></label>
                    </div>

                    <div id="boatPlacementPanel" class="hide">
                        <label>Direction</label>
                        <select class="form-control" name="direction">
                            <option value="up">UP</option>
                            <option value="down">DOWN</option>
                            <option value="left">LEFT</option>
                            <option value="right">RIGHT</option>
                        </select>
                        <label>Column</label>
                        <select class="form-control" name="columns"></select>
                        <label>Row</label>
                        <select class="form-control" name="rows"></select>
                        <button class="btn form-control btn-primary my-4" onClick="placeBoat()">Sumbit</button>
                    </div>
                </div>
            </div>
            <div class="col-md-6">

                <div class="alert-light d-flex justify-content-center" id="playerBoard">

                </div>

            </div>

            <div class="col-md-6">AI oponents strike list</div>
            <div class="col-md-6">

                <div class="alert-light d-flex justify-content-center" id="computerBoard">

                </div>

            </div>

        </div>

    </div>

</body>
<script src="js/functionality.js"></script>

</html>

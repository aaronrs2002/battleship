<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Battleship</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.2/css/all.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.2/css/brands.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.8.2/css/solid.css" rel="stylesheet" />
    <!-- Bootstrap CSS-->
    <link href="https://bootswatch.com/5/spacelab/bootstrap.css" rel="stylesheet" id="themedStyle">

    <link rel="stylesheet" href="https://aaronrs2002.github.io/black-jack/css/animate.min.css" />
    <link href="https://aaronrs2002.github.io/black-jack/css/shared.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet" />

</head>

<body>
    <h1>Battleship</h1>




    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <div id="gamePanel" class="hide">
                    <label>Hunt down the enemy!</label>

                    <div class="alert-light d-flex justify-content-center" id="computerBoard"></div>
                </div>
                <div id="placementPanel">
                    <label>Select a boat. Then submit where you want to place the selected boat.</label>
                    <div class="form-group">
                        <ul id="userBoats" class="list-group-numbered"></ul>
                        <div>
                            <h3 id="boatSelectedTitle"></h3>
                            <label id="errorMessage" class="text-danger"></label>
                        </div>

                        <div id="boatPlacementPanel">
                            <label>Direction</label>
                            <select class="form-control" name="direction">
                                <option value="up">UP</option>
                                <option value="down">DOWN</option>
                                <option value="left">LEFT</option>
                                <option value="right">RIGHT</option>
                            </select>
                            <label>Row</label>
                            <select class="form-control" name="rows"></select>
                            <label>Column</label>
                            <select class="form-control" name="columns"></select>

                            <button class="btn form-control btn-primary my-4" onClick="placeBoat()">Sumbit</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <label>Player Board</label>
                <div class="alert-light d-flex justify-content-center" id="playerBoard">

                </div>

            </div>




        </div>

    </div>

    </div>
    <div class="hide alert fadeInUp" role="alert" id="globalAlert"></div>
    <footer class="footer mt-auto py-3 animated fadeInUp">
        <div class="container">
            <div class="row">
                <div class="col-md-4">
                    <div class="btn-group block my-2" role="group" id="gameLinks"></div>
                </div>
                <div class="col-md-2 my-2"> <select class="form-control" onChange="changeTheme()" id="themes"></select>
                </div>
                <div class="col-md-4" id="socialList">
                </div>
                <div class="col-md-2 my-3" id="year" data-test="test"></div>
            </div>
        </div>
    </footer>


</body>
<script src="https://aaronrs2002.github.io/black-jack/js/footer.js"></script>
<script src="js/functionality.js"></script>

</html>
